<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EsquadriasPro — Gestão de Projetos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#F5F5F5;font-family:Georgia,serif}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;
const BG="#F5F5F5",SURFACE="#EBEBEB",CARD="#FFFFFF",BORDER="#DCDCDC",TEXT="#1A1714",MUTED="#5A5754",ACCENT="#C4622D",GREEN="#3D6B4F",GREEN2="#E8F2EC",AMBER="#B8860B",AMBER2="#FDF6E0",RED="#C84040",RED2="#FDEAEA",WA="#25D366";
const STATUS=[{key:"aprovado",label:"Aprovado",dot:GREEN,bg:GREEN2,text:GREEN},{key:"producao",label:"Em Produção",dot:AMBER,bg:AMBER2,text:AMBER},{key:"entregue",label:"Entregue",dot:ACCENT,bg:"#FDF0E8",text:ACCENT},{key:"cancelado",label:"Cancelado",dot:RED,bg:RED2,text:RED}];
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const PAGAMENTOS=["À Vista","Cartão de Crédito","Cartão de Débito","PIX","Boleto","Parcelado","Cheque","Outro"];
const SEED=[
  {id:1,name:"RESIDÊNCIA ALMEIDA",city:"SÃO PAULO",phone:"(11) 99812-3344",closingDate:"2026-05-02",status:"producao",medicao:"2026-06-05",delivery:"2026-06-25",valor:"",pagamento:""},
  {id:2,name:"CONSTRUTORA HORIZONTE",city:"CAMPINAS",phone:"(19) 98765-0011",closingDate:"2026-04-18",status:"aprovado",medicao:"2026-05-28",delivery:"2026-06-18",valor:"",pagamento:""},
  {id:3,name:"LOJA COMERCIAL BOA VISTA",city:"GUARULHOS",phone:"(11) 93344-7788",closingDate:"2026-03-10",status:"entregue",medicao:"2026-04-15",delivery:"2026-04-30",valor:"",pagamento:""},
];
const EMPTY={name:"",city:"",phone:"",closingDate:"",status:"aprovado",medicao:"",delivery:"",valor:"",pagamento:""};
const fmt=d=>{if(!d)return"—";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`};
const daysLeft=d=>{if(!d)return null;return Math.ceil((new Date(d+"T12:00")-new Date())/86400000)};

function enviarWhatsApp(p){
  const st=STATUS.find(s=>s.key===p.status)||STATUS[0];
  const msg=[
    `Olá! Seu projeto foi cadastrado com sucesso. Seguem as informações:`,``,
    `*${p.name}*`,`📍 ${p.city}`,`Status: *${st.label}*`,``,
    `📅 *Datas do Projeto:*`,
    `• Fechamento: ${fmt(p.closingDate)}`,
    `• Medição Final: ${fmt(p.medicao)}`,
    `• Entrega Final: ${fmt(p.delivery)}`,``,
    `━━━━━━━━━━━━━━━━━━━━`,
    `*Combinados para que tudo corra bem* 😊`,``,
    `* Assim que você nos avisar, faremos a medição final em até 8 dias.`,``,
    `* Caso o ambiente não esteja pronto na data agendada, precisaremos remarcar e cobrar um valor de R$ 350,00 pelo novo deslocamento. Por isso, fique à vontade para nos chamar somente quando estiver tudo pronto!`,``,
    `* Para esquadrias nas cores branco e preto, o prazo de entrega é de 50 dias úteis.`,``,
    `* Para esquadrias em outras cores, o prazo é de 60 dias úteis.`,``,
    `* O prazo começa a contar somente após a medição de todos os vãos.`,``,
    `* Trabalhamos com medição e entrega completa do projeto, sem divisão em partes.`,``,
    `* Para garantir um resultado perfeito, todos os vãos precisam estar finalizados antes da medição.`,``,
    `* Para que a entrega aconteça ainda este ano, a medição final precisa ser realizada até as seguintes datas: 10 de outubro para esquadrias nas cores branco e preto, e 15 de setembro para qualquer outra cor.`,``,
    `* O período de 15 de dezembro a 15 de janeiro não é contabilizado no prazo de entrega, pois nossa equipe estará em férias coletivas. Pedimos que considerem essa pausa no planejamento de vocês! 😊`,``,
    `* Caso haja algum imprevisto e a medição final precise ser remarcada, a data de entrega poderá ser ajustada de acordo com a nossa agenda de produção. Faremos o possível para minimizar qualquer impacto no seu prazo! 😊`,``,
    `* Caso durante a instalação seja necessário utilizar perfis ou insumos adicionais para acabamento devido a erros de terceiros, os valores correspondentes serão repassados ao cliente.`,``,
    `Estamos à disposição para qualquer dúvida. Será um prazer trabalhar com você! 🤝`,
  ].join("\n");
  const phone=p.phone.replace(/\D/g,"");
  window.open(`https://wa.me/55${phone}?text=${encodeURIComponent(msg)}`,"_blank");
}

function Pill({date}){
  const d=daysLeft(date);if(d===null)return null;
  const[bg,color,label]=d<0?[RED2,RED,`${Math.abs(d)}d atraso`]:d===0?[AMBER2,AMBER,"Hoje"]:d<=7?[AMBER2,AMBER,`${d}d`]:[GREEN2,GREEN,`${d}d`];
  return <span style={{background:bg,color,borderRadius:4,padding:"2px 8px",fontSize:9,fontWeight:800}}>{label}</span>;
}

function StatusDot({status}){
  const s=STATUS.find(x=>x.key===status)||STATUS[0];
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,background:s.bg,color:s.text,borderRadius:4,padding:"3px 10px",fontSize:10,fontWeight:800}}>
    <span style={{width:5,height:5,borderRadius:"50%",background:s.dot}}/>{s.label}
  </span>;
}

const INP={width:"100%",boxSizing:"border-box",border:`1px solid ${BORDER}`,borderRadius:6,padding:"10px 12px",fontSize:13,background:SURFACE,color:TEXT,outline:"none",fontFamily:"inherit",fontWeight:700,textTransform:"uppercase"};
function Lbl({children}){return <div style={{fontSize:9,fontWeight:800,color:MUTED,letterSpacing:1.5,marginBottom:6,textTransform:"uppercase"}}>{children}</div>;}

function Modal({children,onClose}){
  return <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,zIndex:400,background:"rgba(26,23,20,.45)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:CARD,borderRadius:16,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 32px 80px rgba(0,0,0,.2)",border:`1px solid ${BORDER}`}}>{children}</div>
  </div>;
}

function Card({p,onClick}){
  const st=STATUS.find(s=>s.key===p.status)||STATUS[0];
  return <div onClick={onClick} style={{background:CARD,borderRadius:12,border:`1px solid ${BORDER}`,padding:"22px 26px",cursor:"pointer",position:"relative",overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,.05)",transition:"all .18s"}}
    onMouseEnter={e=>{e.currentTarget.style.borderColor=ACCENT;e.currentTarget.style.boxShadow=`0 6px 20px rgba(196,98,45,.15)`;}}
    onMouseLeave={e=>{e.currentTarget.style.borderColor=BORDER;e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,.05)";}}>
    <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:st.dot,borderRadius:"12px 0 0 12px"}}/>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
      <div style={{flex:1}}>
        <div style={{fontSize:16,fontWeight:800,color:TEXT,marginBottom:5}}>{p.name}</div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:MUTED,fontWeight:700}}>📍 {p.city}</span>
          <span style={{fontSize:11,color:MUTED,fontWeight:700}}>📞 {p.phone}</span>
          <span style={{fontSize:11,color:MUTED,fontWeight:700}}>Fechamento: {fmt(p.closingDate)}</span>
        </div>
        {(p.valor||p.pagamento)&&<div style={{display:"flex",gap:10,marginTop:7,flexWrap:"wrap"}}>
          {p.valor&&<span style={{fontSize:11,fontWeight:800,color:GREEN,background:GREEN2,borderRadius:4,padding:"2px 8px"}}>💰 {p.valor}</span>}
          {p.pagamento&&<span style={{fontSize:11,fontWeight:800,color:MUTED,background:SURFACE,borderRadius:4,padding:"2px 8px"}}>💳 {p.pagamento}</span>}
        </div>}
      </div>
      <StatusDot status={p.status}/>
    </div>
    <div style={{height:1,background:BORDER,marginBottom:14}}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {[{label:"Medição",date:p.medicao},{label:"Entrega",date:p.delivery}].map((m,i)=>{
        const d=daysLeft(m.date);const late=d!==null&&d<0;
        return <div key={i} style={{padding:"11px 13px",background:late?RED2:SURFACE,borderRadius:8,border:`1px solid ${late?"#F5C0C0":BORDER}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
            <span style={{fontSize:10,fontWeight:800,color:late?RED:MUTED}}>{m.label}</span>
            <Pill date={m.date}/>
          </div>
          <div style={{fontSize:14,fontWeight:800,color:late?RED:TEXT}}>{fmt(m.date)}</div>
        </div>;
      })}
    </div>
  </div>;
}

function App(){
  const[projects,setProjects]=useState(()=>{try{const s=localStorage.getItem("eq_v2");return s?JSON.parse(s):SEED;}catch(e){return SEED;}});
  const[modal,setModal]=useState(null);
  const[selected,setSelected]=useState(null);
  const[form,setForm]=useState(EMPTY);
  const[search,setSearch]=useState("");
  const[filtroMed,setFiltroMed]=useState("");
  const[filtroEnt,setFiltroEnt]=useState("");

  const saveP=ps=>{setProjects(ps);try{localStorage.setItem("eq_v2",JSON.stringify(ps));}catch(e){}};
  const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const openNew=()=>{setForm({...EMPTY});setSelected(null);setModal("new");};
  const openEdit=p=>{setForm({...p});setSelected(p);setModal("edit");};
  const openView=p=>{setSelected(p);setModal("view");};
  const saveForm=()=>{
    const proj={...form,id:selected?selected.id:Date.now()};
    if(modal==="new")saveP([proj,...projects]);
    else saveP(projects.map(p=>p.id===proj.id?proj:p));
    setModal(null);
  };
  const deleteProj=id=>{
    if(window.confirm("Deseja realmente excluir este projeto?"))
      {saveP(projects.filter(p=>p.id!==id));setModal(null);}
  };

  const filtered=projects.filter(p=>{
    const txt=p.name.toLowerCase().includes(search.toLowerCase())||p.city.toLowerCase().includes(search.toLowerCase());
    const med=filtroMed?(p.medicao&&p.medicao.split("-")[1]===filtroMed):true;
    const ent=filtroEnt?(p.delivery&&p.delivery.split("-")[1]===filtroEnt):true;
    return txt&&med&&ent;
  });

  const alertas=projects.filter(p=>{
    if(!p.medicao||p.status==="entregue"||p.status==="cancelado")return false;
    const d=daysLeft(p.medicao);return d!==null&&d<-30;
  });

  const amanha=projects.filter(p=>{
    if(!p.medicao||p.status==="entregue"||p.status==="cancelado")return false;
    return daysLeft(p.medicao)===1;
  });

  const selStyle=(active,cor)=>({width:"100%",boxSizing:"border-box",border:`1px solid ${active?cor:BORDER}`,borderRadius:8,padding:"10px 12px",fontSize:12,background:active?(cor===GREEN?GREEN2:"#FDF0E8"):SURFACE,color:active?cor:TEXT,outline:"none",fontFamily:"inherit",fontWeight:700});

  return <div style={{minHeight:"100vh",background:BG,fontFamily:"Georgia,serif",color:TEXT,fontWeight:700}}>

    {amanha.length>0&&<div style={{background:"#7c3aed",padding:"12px 28px"}}>
      <div style={{maxWidth:1000,margin:"0 auto",display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:20}}>🔔</span>
        <div>
          <div style={{color:"#fff",fontSize:12,fontWeight:800,letterSpacing:.5}}>MEDIÇÃO AMANHÃ!</div>
          <div style={{color:"#ddd6fe",fontSize:11,marginTop:2}}>{amanha.map(p=>`${p.name} — ${p.city}`).join(" · ")}</div>
        </div>
      </div>
    </div>}

    {alertas.length>0&&<div style={{background:RED,padding:"10px 28px"}}>
      <div style={{maxWidth:1000,margin:"0 auto",display:"flex",alignItems:"center",gap:10}}>
        <span>⚠️</span>
        <span style={{color:"#fff",fontSize:11,fontWeight:800}}>{alertas.length} projeto{alertas.length>1?"s":""} com medição há mais de 30 dias sem entrega: </span>
        <span style={{color:"#ffd0d0",fontSize:11}}>{alertas.map(p=>p.name).join(" · ")}</span>
      </div>
    </div>}

    <header style={{borderBottom:`1px solid ${BORDER}`,background:CARD,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
      <div style={{maxWidth:1000,margin:"0 auto",padding:"0 28px",height:64,display:"flex",alignItems:"center",gap:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:4,height:32,background:ACCENT,borderRadius:2}}/>
          <div>
            <div style={{fontSize:15,fontWeight:800,color:TEXT,letterSpacing:1,textTransform:"uppercase"}}>EsquadriasPro</div>
            <div style={{fontSize:8,fontWeight:700,color:MUTED,letterSpacing:2,textTransform:"uppercase"}}>Gestão de Projetos</div>
          </div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:12}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..."
            style={{...INP,width:200,padding:"8px 12px",fontSize:11,textTransform:"none"}}/>
          <span style={{fontSize:11,color:MUTED}}>{filtered.length} projeto{filtered.length!==1?"s":""}</span>
          <button onClick={openNew} style={{background:ACCENT,color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",fontWeight:800,fontSize:11,cursor:"pointer",textTransform:"uppercase"}}>+ Novo Projeto</button>
        </div>
      </div>
    </header>

    <main style={{maxWidth:1000,margin:"0 auto",padding:"32px 28px"}}>
      <button onClick={openNew} style={{width:"100%",background:ACCENT,color:"#fff",border:"none",borderRadius:12,padding:"16px 0",fontWeight:800,fontSize:14,cursor:"pointer",textTransform:"uppercase",letterSpacing:1,marginBottom:20,boxShadow:`0 4px 16px rgba(196,98,45,.28)`,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
        <span style={{fontSize:20}}>+</span> Novo Projeto
      </button>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        <div>
          <Lbl>📐 Mês da Medição</Lbl>
          <select value={filtroMed} onChange={e=>setFiltroMed(e.target.value)} style={selStyle(!!filtroMed,GREEN)}>
            <option value="">Todos os meses</option>
            {MESES.map((m,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{m}</option>)}
          </select>
        </div>
        <div>
          <Lbl>🚚 Mês da Entrega</Lbl>
          <select value={filtroEnt} onChange={e=>setFiltroEnt(e.target.value)} style={selStyle(!!filtroEnt,ACCENT)}>
            <option value="">Todos os meses</option>
            {MESES.map((m,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{m}</option>)}
          </select>
        </div>
      </div>

      {(filtroMed||filtroEnt)&&<div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <button onClick={()=>{setFiltroMed("");setFiltroEnt("");}} style={{background:RED2,color:RED,border:`1px solid #F5C0C0`,borderRadius:6,padding:"5px 14px",fontSize:11,fontWeight:800,cursor:"pointer"}}>✕ Limpar Filtros</button>
      </div>}

      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {filtered.map(p=><Card key={p.id} p={p} onClick={()=>openView(p)}/>)}
        {filtered.length===0&&<div style={{textAlign:"center",padding:"60px 0",color:MUTED}}>
          <div style={{fontSize:36,marginBottom:12}}>◎</div>
          <div style={{fontSize:14,fontWeight:700}}>Nenhum projeto encontrado</div>
        </div>}
      </div>
    </main>

    {modal==="view"&&selected&&<Modal onClose={()=>setModal(null)}>
      <div style={{padding:30}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
          <div>
            <StatusDot status={selected.status}/>
            <div style={{fontSize:18,fontWeight:800,color:TEXT,marginTop:10}}>{selected.name}</div>
            <div style={{fontSize:11,color:MUTED,fontWeight:700,marginTop:4}}>📍 {selected.city} · 📞 {selected.phone}</div>
          </div>
          <button onClick={()=>setModal(null)} style={{background:"none",border:"none",fontSize:20,color:MUTED,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:selected.valor?"1fr 1fr":"1fr",gap:12,marginBottom:14}}>
          <div style={{background:SURFACE,borderRadius:10,padding:14}}>
            <Lbl>Data de Fechamento</Lbl>
            <div style={{fontSize:16,fontWeight:800}}>{fmt(selected.closingDate)}</div>
          </div>
          {selected.valor&&<div style={{background:GREEN2,borderRadius:10,padding:14,border:`1px solid ${GREEN}30`}}>
            <Lbl>Valor</Lbl>
            <div style={{fontSize:16,fontWeight:800,color:GREEN}}>{selected.valor}</div>
          </div>}
        </div>
        {selected.pagamento&&<div style={{background:SURFACE,borderRadius:10,padding:14,marginBottom:14}}>
          <Lbl>Forma de Pagamento</Lbl>
          <div style={{fontSize:14,fontWeight:800}}>💳 {selected.pagamento}</div>
        </div>}
        <Lbl>Linha do Tempo</Lbl>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:8,marginBottom:22}}>
          {[{label:"Medição Final",date:selected.medicao,icon:"◉"},{label:"Entrega Final",date:selected.delivery,icon:"◎"}].map(item=>{
            const d=daysLeft(item.date);const late=d!==null&&d<0;
            return <div key={item.label} style={{display:"flex",alignItems:"center",gap:14,background:late?RED2:SURFACE,border:`1px solid ${late?"#F5C0C0":BORDER}`,borderRadius:10,padding:"13px 16px"}}>
              <span style={{fontSize:18,color:late?RED:ACCENT}}>{item.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:10,fontWeight:800,color:late?RED:MUTED,marginBottom:2}}>{item.label}</div>
                <div style={{fontSize:15,fontWeight:800,color:late?RED:TEXT}}>{fmt(item.date)}</div>
              </div>
              <Pill date={item.date}/>
            </div>;
          })}
        </div>
        <div style={{display:"flex",gap:10,marginBottom:10}}>
          <button onClick={()=>{setModal(null);openEdit(selected);}} style={{flex:1,background:SURFACE,color:TEXT,border:`1px solid ${BORDER}`,borderRadius:8,padding:"11px 0",cursor:"pointer",fontWeight:800,fontSize:11,textTransform:"uppercase"}}>Editar</button>
        </div>
        <button onClick={()=>enviarWhatsApp(selected)} style={{width:"100%",background:WA,color:"#fff",border:"none",borderRadius:8,padding:"12px 0",cursor:"pointer",fontWeight:800,fontSize:12,textTransform:"uppercase"}}>💬 Enviar WhatsApp</button>
      </div>
    </Modal>}

    {(modal==="new"||modal==="edit")&&<Modal onClose={()=>setModal(null)}>
      <div style={{padding:30}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:26}}>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:TEXT,textTransform:"uppercase"}}>{modal==="new"?"Novo Projeto":"Editar Projeto"}</div>
            <div style={{width:32,height:2,background:ACCENT,marginTop:6}}/>
          </div>
          <button onClick={()=>setModal(null)} style={{background:"none",border:"none",fontSize:20,color:MUTED,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div>
            <Lbl>Nome do Projeto / Obra</Lbl>
            <input style={INP} value={form.name} onChange={e=>F("name",e.target.value.toUpperCase())} placeholder="EX: RESIDÊNCIA SILVA"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <div>
              <Lbl>Cidade</Lbl>
              <input style={INP} value={form.city} onChange={e=>F("city",e.target.value.toUpperCase())} placeholder="EX: SÃO PAULO"/>
            </div>
            <div>
              <Lbl>Telefone</Lbl>
              <input style={{...INP,textTransform:"none"}} value={form.phone} onChange={e=>F("phone",e.target.value)} placeholder="(11) 9xxxx-xxxx"/>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            <div>
              <Lbl>Data de Fechamento</Lbl>
              <input type="date" style={{...INP,textTransform:"none"}} value={form.closingDate} onChange={e=>F("closingDate",e.target.value)}/>
            </div>
            <div>
              <Lbl>Status</Lbl>
              <select style={{...INP,textTransform:"none"}} value={form.status} onChange={e=>F("status",e.target.value)}>
                {STATUS.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </div>
          </div>
          <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:14}}>
            <div style={{fontSize:9,fontWeight:800,color:GREEN,letterSpacing:2,marginBottom:12,textTransform:"uppercase"}}>💰 Financeiro (uso interno)</div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <Lbl>Valor do Projeto</Lbl>
                <input style={{...INP,textTransform:"none"}} value={form.valor} onChange={e=>F("valor",e.target.value)} placeholder="R$ 0,00"/>
              </div>
              <div>
                <Lbl>Forma de Pagamento</Lbl>
                <select style={{...INP,textTransform:"none"}} value={form.pagamento} onChange={e=>F("pagamento",e.target.value)}>
                  <option value="">Selecione...</option>
                  {PAGAMENTOS.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>
          </div>
          <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:14}}>
            <div style={{fontSize:9,fontWeight:800,color:ACCENT,letterSpacing:2,marginBottom:12,textTransform:"uppercase"}}>Datas do Processo</div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <Lbl>Medição Final</Lbl>
                <input type="date" style={{...INP,textTransform:"none"}} value={form.medicao} onChange={e=>F("medicao",e.target.value)}/>
              </div>
              <div>
                <Lbl>Data de Entrega</Lbl>
                <input type="date" style={{...INP,textTransform:"none"}} value={form.delivery} onChange={e=>F("delivery",e.target.value)}/>
              </div>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:26}}>
          {modal==="edit"&&<button onClick={()=>deleteProj(selected.id)} style={{background:RED2,color:RED,border:`1px solid #F5C0C0`,borderRadius:8,padding:"11px 16px",cursor:"pointer",fontWeight:800,fontSize:11}}>🗑️</button>}
          <button onClick={()=>setModal(null)} style={{flex:1,background:SURFACE,color:TEXT,border:`1px solid ${BORDER}`,borderRadius:8,padding:"11px 0",cursor:"pointer",fontWeight:800,fontSize:11}}>Cancelar</button>
          <button onClick={saveForm} style={{flex:2,background:ACCENT,color:"#fff",border:"none",borderRadius:8,padding:"11px 0",cursor:"pointer",fontWeight:800,fontSize:13}}>{modal==="new"?"Criar Projeto":"Salvar"}</button>
        </div>
      </div>
    </Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
